name: V3 Mobile Production Parity 2026-09-12

on:
  push:
    branches:
      - release/v3-production-web-mobile-parity-20260912
  pull_request:
    branches:
      - desifaces-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm release branch lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin desifaces-v3 --quiet
          git merge-base --is-ancestor origin/desifaces-v3 HEAD || {
            echo "FAIL: mobile release candidate is not based on desifaces-v3"
            exit 1
          }
          echo MOBILE_RELEASE_LINEAGE=PASS

      - name: Production parity certification
        shell: bash
        run: bash scripts/certify-v3-production-mobile-parity.sh

      - name: Final marker
        run: |
          echo MOBILE_PRODUCTION_PARITY=PASS
          echo STORE_SUBMISSION=NONE
          echo PRODUCTION_TOUCH=NONE
