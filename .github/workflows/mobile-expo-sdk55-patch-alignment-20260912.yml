name: V3 Mobile Expo SDK 55 Patch Alignment

on:
  push:
    branches:
      - release/v3-production-web-mobile-parity-20260912
    paths:
      - '.github/workflows/mobile-expo-sdk55-patch-alignment-20260912.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v3-mobile-expo-sdk55-patch-alignment
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v3-production-web-mobile-parity-20260912
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile for source-controlled SDK 55 patch versions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "release/v3-production-web-mobile-parity-20260912"

          # package.json is updated explicitly in source control. Regenerate only
          # package-lock.json here; never let Expo rewrite dynamic app.config.ts.
          npm install --package-lock-only --ignore-scripts

          CHANGED="$(git diff --name-only)"
          BAD="$(printf '%s\n' "$CHANGED" | grep -Ev '^(package-lock.json)$' || true)"
          if [ -n "$BAD" ]; then
            echo "FAIL: lock regeneration touched unexpected files"
            printf '%s\n' "$BAD"
            exit 1
          fi

          npm ci
          npx --yes expo-doctor
          npm run certify:v3-story

          if git diff --quiet -- package-lock.json; then
            echo EXPO_SDK55_LOCK_ALIGNMENT=ALREADY_CURRENT
            exit 0
          fi

          git config user.name 'desifaces-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(mobile): refresh Expo SDK 55 dependency lock'
          git push origin HEAD:release/v3-production-web-mobile-parity-20260912
          echo EXPO_SDK55_LOCK_ALIGNMENT=PASS
          echo PRODUCTION_TOUCH=NONE
