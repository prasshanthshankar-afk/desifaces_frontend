name: Mobile Group Photo Launch Certification

on:
  push:
    branches:
      - feature/mobile-group-photo-launch-parity-20261001
  pull_request:
    branches:
      - fix/mobile-web-parity-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: mobile-launch-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mobile candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Group-photo launch source gate
        run: python3 scripts/test-v3-mobile-capability-parity.py

      - name: TypeScript compile gate
        run: npx tsc --noEmit --pretty false

      - name: Lint changed mobile surfaces
        run: >-
          npx eslint
          src/features/face/SharedSceneSetupScreen.tsx
          src/features/face/api/sharedScene.ts
          src/features/media/MediaLibraryScreen.tsx
          src/features/media/libraryTaxonomy.ts
          --max-warnings=0

      - name: Expo doctor
        run: npx expo-doctor

      - name: Launch marker
        run: |
          echo MOBILE_GROUP_PHOTO_LAUNCH_SOURCE=PASS
          echo DATABASE_MIGRATION=NONE
          echo PRICING_MODEL_MUTATION=NONE
          echo STORE_SUBMISSION=NONE
